<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explora Saltillo - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/style.css">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Encabezado / Navegación -->
    <header class="navbar">
        <div class="logo">
            <a href="index.html" style="text-decoration: none; color: inherit;">
                <h1>SalTurismo</h1>
                <span class="slogan">¡A dónde vamos!?</span>
            </a>
        </div>
        <nav class="nav-links">
            <a href="index.html">Eventos</a>
            <a href="index.html">Turismo</a>
            <a href="index.html">Historia</a>
            <a href="index.html">Contacto</a>
        </nav>
        <button type="button" class="btn-login" onclick="window.location.href='login.html'">Iniciar Sesión</button>
    </header>

    <!-- Sección Principal con Fondo -->
    <section class="hero-section hero-login">
        <!-- Tarjeta / Modal de Login -->
        <div class="login-card">
            
            <!-- Ilustración Izquierda -->
            <div class="login-illustration">
                <!-- ruta imagen -->
                <img src="../images/LoginSaltillo.jpg" alt="Ilustración Saltillo">
            </div>

            <!-- Formulario Derecha -->
            <div class="login-form-container">
                <h2>Iniciar Sesión en<br>SalTurismo</h2>

                <form class="login-form">
                    <div class="input-group">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" placeholder="Correo Electrónico" required>
                    </div>

                    <div class="input-group">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" placeholder="Contraseña" required>
                        <i class="fa-regular fa-eye-slash toggle-password"></i>
                    </div>

                    <a href="#" class="forgot-password">olvidé mi contraseña</a>

                    <button type="button" class="btn-primary btn-submit">Entrar</button>

                    <div class="divider">
                        <span>o iniciar con</span>
                    </div>

                    <div class="social-login">
                        <button type="button" class="btn-social">
                            <i class="fa-brands fa-facebook"></i> Facebook
                        </button>
                        <button type="button" class="btn-social" id="btn-google-login">
                            <i class="fa-brands fa-google"></i> Google
                        </button>
                    </div>

                    <p class="register-text">
                        No tienes cuenta? <a href="register.html">Regístrate</a>
                    </p>
                </form>
            </div>

        </div>
    </section>

    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Autenticación -->
    <script src="../js/auth.js"></script>
</body>
</html>
